# Documentation site for https://dhilipkumars.github.io/axiom/
#
# The docs directory is the repository's own docs/, not a copy, so the site and
# the tree never disagree. Two halves live there:
#
#   guides/ and index.md  written by people, reviewed by people
#   generated/            produced by `make docs-generate` from the code
#
# The design notes at the end of the nav are the project's own engineering
# documents. They are published rather than hidden because the reasoning in
# them is the most useful thing about this repository, but they are written for
# contributors, not users, and the nav says so.
site_name: Axiom
site_description: Query and change Kubernetes with SQL, through a Postgres foreign data wrapper.
site_url: https://dhilipkumars.github.io/axiom/
repo_url: https://github.com/dhilipkumars/axiom
repo_name: dhilipkumars/axiom
edit_uri: edit/main/docs/

docs_dir: docs

# Agent role definitions live under docs/ for proximity to the rules they
# reference, but they are tooling configuration, not documentation, and have no
# reader on the site.
# snippets/ holds the query files the examples pages include; on their own
# they are not pages.
exclude_docs: |
  agents/
  snippets/

theme:
  name: material
  # Template overrides: the <head> additions every page needs, such as site
  # verification tags.
  custom_dir: docs-overrides
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  # Pages include the files CI runs rather than copies of them: the examples
  # pages' queries (docs/snippets/) and the programs' READMEs (examples/).
  # check_paths turns a moved file into a failed build, not a blank block.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  # Install routes side by side as tabs: deb | rpm | tarball.
  - pymdownx.tabbed:
      alternate_style: true

# Pages that moved in the docs reorganization (#115). Old links, including the
# README's and anything search engines indexed, forward to the new home.
plugins:
  - search
  - redirects:
      redirect_maps:
        guides/getting-started.md: guides/quick-start.md
        guides/deploying.md: guides/install/gateway.md
        guides/querying.md: guides/examples/how-tables-work.md

nav:
  - Home:
      - index.md
      - Architecture: architecture.md
      - Compatibility: compatibility.md
  - Guides:
      - Prerequisites: guides/prerequisites.md
      - Quick start: guides/quick-start.md
      - Install:
          - guides/install/index.md
          - The gateway: guides/install/gateway.md
          - Postgres image: guides/install/postgres-image.md
          - Packages: guides/install/packages.md
          - From source: guides/install/from-source.md
          - Restricting access: guides/install/rbac.md
      - Initialize: guides/initialize.md
      - Examples:
          - guides/examples/index.md
          - How tables work: guides/examples/how-tables-work.md
          - Capacity and risk review: guides/examples/capacity-review.md
          - Changing the cluster: guides/examples/changing-the-cluster.md
          - Manage Postgres with Postgres: guides/examples/manage-postgres.md
          - A silly Kubernetes operator in SQL: guides/examples/sql-operator.md
          - Your deployment, in chronological order: guides/examples/deploy-timeline.md
          - "Did your patch regress? pgbench across Postgres 16, 17 and 18": guides/examples/regression-lab.md
      - For AI agents: guides/for-agents.md
      - Giving an AI agent access: guides/agent-access.md
  - Reference:
      - gRPC API: generated/api.md
      - Gateway flags: generated/gateway-flags.md
      - FDW options: generated/fdw-options.md
      - Foreign table columns: generated/columns.md
  - For contributors:
      - Developer guide: development.md
      - Architecture notes: DESIGN.md
      - Auth design: AUTH.md
      - Engineering rules: RULES.md
      - Phase plan: PLAN.md
      - Releasing: RELEASING.md

strict: true
