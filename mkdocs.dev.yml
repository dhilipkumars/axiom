# The dev track of the docs site (#114): main's docs, published under
# /axiom/dev/ beside the released docs at /axiom/, which are built from the
# latest release's release-X.Y branch. Everything not set here comes from
# mkdocs.yml.
#
# extra.dev turns on the "unreleased" banner and asks search engines not to
# index these pages, so a search lands on the docs for what people can
# install (docs-overrides/main.html).
INHERIT: mkdocs.yml
site_url: https://dhilipkumars.github.io/axiom/dev/
extra:
  dev: true
