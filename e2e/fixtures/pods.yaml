# Known Pods for the pods E2E. `pause` does nothing and is always Running.
apiVersion: v1
kind: Namespace
metadata:
  name: axiom-e2e
---
apiVersion: v1
kind: Pod
metadata:
  name: web-0
  namespace: axiom-e2e
  labels: { app: web }
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: web-1
  namespace: axiom-e2e
  labels: { app: web }
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: db-0
  namespace: axiom-e2e
  labels: { app: db }
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
