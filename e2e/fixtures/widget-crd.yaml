# A test CRD for the Phase 4 gate. Deliberately ordinary: a namespaced kind
# with spec and status objects and nothing exotic, so the test proves the
# generic path works rather than that a special case was handled.
#
# There is intentionally no `subresources: status` here. With a status
# subresource the API server silently ignores status changes in a PUT to the
# main resource, so a SQL UPDATE of the status column would appear to succeed
# and change nothing. Writing a status subresource needs its own request and is
# not in Phase 4's scope; this fixture stays on the path the extension actually
# implements.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
    listKind: WidgetList
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: integer
                color:
                  type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
                phase:
                  type: string
