# The `shop` namespace the docs gate runs the examples pages against: a small
# shop with one of each problem the pages show how to find. Every container is
# `pause`, so nothing here pulls more than the image the other gates use, and
# every problem is produced by the spec rather than by timing.
#
#   web              healthy, 2 replicas, requests and no limits
#   catalog          healthy, requests 256Mi and uses well under a fifth of it
#   checkout         stuck at 0/1: asks for more CPU than any node has
#   checkout-worker  crash-loops: its command does not exist in the image
#   report           never starts: its image does not exist
#   checkout-config  a ConfigMap for the write examples
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { memory: 16Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog }
  template:
    metadata:
      labels: { app: catalog }
    spec:
      containers:
        - name: catalog
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { memory: 256Mi }
            limits: { memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: { app: checkout }
  template:
    metadata:
      labels: { app: checkout }
    spec:
      containers:
        - name: checkout
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { cpu: "64" }
---
apiVersion: v1
kind: Pod
metadata:
  name: checkout-worker
  namespace: shop
  labels: { app: checkout-worker }
spec:
  containers:
    - name: worker
      image: registry.k8s.io/pause:3.10
      command: ["/checkout-worker"]
---
apiVersion: v1
kind: Pod
metadata:
  name: report
  namespace: shop
  labels: { app: report }
spec:
  restartPolicy: Never
  containers:
    - name: report
      image: registry.invalid/shop/report:1.4
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: shop
data:
  LOG_LEVEL: info
  CURRENCY: EUR
---
# The find-and-fix example annotates Deployments. The shipped RBAC grants
# writes per resource and deliberately not this one, which is what the page
# tells readers to grant first.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: axiom-e2e-docs-deployment-write
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axiom-e2e-docs-deployment-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: axiom-e2e-docs-deployment-write
subjects:
  - kind: ServiceAccount
    name: axiom-gateway
    namespace: axiom-system
