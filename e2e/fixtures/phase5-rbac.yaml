# Deliberately partial RBAC for the Phase 5 gate.
#
# The gateway's --serve list is wide open in this scenario, so everything the
# gate observes about which kinds are offered is a consequence of *this* file.
# The point is to make the difference visible: kinds granted here appear as
# foreign tables, kinds that exist in the cluster but are absent here do not,
# even though discovery can see them.
#
# Granted:  pods, configmaps, events (core), events (events.k8s.io), widgets
# Withheld: secrets, nodes, deployments, and everything else
#
# The two `events` are both granted on purpose: they are the real collision
# that a schema-per-cluster import has to disambiguate.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: axiom-gateway-phase5
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["example.com"]
    resources: ["widgets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Discovery and OpenAPI. Non-resource URLs; they grant no access to objects.
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*", "/openapi", "/openapi/*", "/version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axiom-gateway-phase5
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: axiom-gateway-phase5
subjects:
  - kind: ServiceAccount
    name: axiom-gateway
    namespace: axiom-system
