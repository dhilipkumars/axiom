name: gateway image

on:
  push:
    branches: [main]
  # On demand, for when a development image is wanted without waiting for a
  # merge.
  workflow_dispatch:
  release:
    types: [published]

# Same reasoning as the postgres image: cancel a superseded branch build so the
# moving `development` tag means the head of main, never cancel a release.
concurrency:
  group: gateway-image-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read
  packages: write

env:
  # The checked-in raw manifest pulls this upstream package by default. Forks
  # that publish elsewhere must patch deploy/k8s/gateway-deployment.yaml too.
  IMAGE_NAME: ghcr.io/dhilipkumars/axiom-gateway

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A release must carry the version it says it does. Checked before
      # anything is pushed, so a mistyped tag fails here rather than becoming a
      # published image nobody can unpublish.
      # Through env, not interpolated into the script: a `${{ }}` expression is
      # substituted into the shell source before it runs, so a tag containing
      # shell metacharacters would be evaluated rather than compared. Git
      # permits most of them in a ref name.
      - if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./scripts/version check "$RELEASE_TAG"

      - id: image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "build_version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            # A prerelease publishes its own tag but must not move :latest,
            # which is the one thing someone pulling without a version is
            # trusting to be the current stable release.
            echo "publish_latest=${{ github.event.release.prerelease && 'false' || 'true' }}" >> "$GITHUB_OUTPUT"
          else
            echo "build_version=development" >> "$GITHUB_OUTPUT"
            echo "publish_latest=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Main branch publishes a moving development tag; published releases
            # additionally publish their own semver tag and move :latest.
            type=raw,value=development,enable=${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
            type=raw,value=${{ steps.image.outputs.release_tag }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ steps.image.outputs.publish_latest == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          build-args: VERSION=${{ steps.image.outputs.build_version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
