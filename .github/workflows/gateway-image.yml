name: gateway image

on:
  # Nightly, not per-merge -- same reasoning as the postgres image: a push to
  # main publishes nothing, and `development` means "main, as of last night"
  # rather than "main, right now". Off the hour because GitHub's scheduler is
  # busiest at :00.
  schedule:
    - cron: "17 3 * * *"
  # On demand, for when a development image is wanted before tonight. As with
  # the postgres image, a dispatch publishes `development` from whichever ref
  # it was started from; see that workflow for why that is deliberate.
  workflow_dispatch:
  release:
    types: [published]

# Same reasoning as the postgres image: cancel a superseded development build
# so the moving tag means the newer source, never cancel a release.
concurrency:
  group: gateway-image-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read
  packages: write

env:
  # The checked-in raw manifest pulls this upstream package by default. Forks
  # that publish elsewhere must patch deploy/k8s/gateway-deployment.yaml too.
  IMAGE_NAME: ghcr.io/dhilipkumars/axiom-gateway

jobs:
  # See the postgres image workflow: a nightly build of a branch that has not
  # moved republishes the same source under a new digest.
  gate:
    name: did main move
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$(git log -1 --since='25 hours ago' --format=%H)" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "main has not moved in 25h; skipping the nightly publish" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Built on the runner that matches the architecture, not under emulation.
  #
  # QEMU took about ten minutes to produce an arm64 Go binary (#28). Native
  # arm64 runners are free for public repositories, so each architecture is
  # compiled on its own machine in parallel, and `merge` below joins them.
  #
  # Each job pushes by *digest* rather than by tag: two jobs pushing the same
  # tag would race, with the loser's architecture silently dropped from the
  # published image. Nothing is tagged until both digests exist.
  build:
    name: ${{ matrix.arch }}
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # A release must carry the version it says it does. Checked before
      # anything is pushed, so a mistyped tag fails here rather than becoming a
      # published image nobody can unpublish.
      #
      # Through env, not interpolated into the script: a `${{ }}` expression is
      # substituted into the shell source before it runs, so a tag containing
      # shell metacharacters would be evaluated rather than compared. Git
      # permits most of them in a ref name.
      - if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./scripts/version check "$RELEASE_TAG"

      - id: image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            echo "build_version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "build_version=development" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          build-args: VERSION=${{ steps.image.outputs.build_version }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # The digest is how `merge` finds this build. A file per architecture,
      # so the two jobs cannot collide on one artifact name.
      # The "sha256:" prefix is stripped because upload-artifact refuses a
      # colon in a filename; `merge` puts it back when building the reference.
      - env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ matrix.arch }}-${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Joins the per-architecture digests into one manifest list and puts the tags
  # on it. This is the only step that tags anything, so a published tag always
  # has both architectures or does not exist.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gateway-digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          tags=()
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            [[ -n "$RELEASE_TAG" ]] || { echo "release event with an empty tag" >&2; exit 1; }
            tags+=(--tag "$IMAGE_NAME:$RELEASE_TAG")
            # A prerelease publishes its own tag but must not move :latest,
            # which is what someone pulling without a version is trusting to be
            # the current stable release.
            [[ "$IS_PRERELEASE" == "true" ]] || tags+=(--tag "$IMAGE_NAME:latest")
          else
            tags+=(--tag "$IMAGE_NAME:development")
          fi
          # The filenames carry "<arch>-sha256:...", so strip the prefix.
          # Asserted, not assumed. `imagetools create` defaults to
          # --prefer-index, so handing it one digest produces a perfectly
          # valid single-architecture manifest list and tags it -- which looks
          # exactly like the missing-arm64 bug this whole change exists to
          # fix. An unmatched glob would also pass the literal "*" through as
          # a reference.
          shopt -s nullglob
          refs=()
          for arch in amd64 arm64; do
            found=(/tmp/digests/"$arch"-*)
            (( ${#found[@]} == 1 )) \
              || { echo "expected exactly one $arch digest, found ${#found[@]}" >&2; exit 1; }
            name="$(basename "${found[0]}")"
            refs+=("$IMAGE_NAME@sha256:${name#*-}")
          done
          (( ${#refs[@]} == 2 )) || { echo "need both architectures" >&2; exit 1; }
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
