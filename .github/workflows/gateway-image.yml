name: gateway image

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  # The checked-in raw manifest pulls this upstream package by default. Forks
  # that publish elsewhere must patch deploy/k8s/gateway-deployment.yaml too.
  IMAGE_NAME: ghcr.io/dhilipkumars/axiom-gateway

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            echo "release_tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "build_version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "publish_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_version=development" >> "$GITHUB_OUTPUT"
            echo "publish_latest=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Main branch publishes a moving development tag; published releases
            # additionally publish their own semver tag and move :latest.
            type=raw,value=development,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.image.outputs.release_tag }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ steps.image.outputs.publish_latest == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          build-args: VERSION=${{ steps.image.outputs.build_version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
