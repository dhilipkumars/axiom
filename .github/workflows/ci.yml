name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PG_MAJOR: "16"
  CARGO_PGRX_VERSION: "0.12.9"

jobs:
  proto:
    name: proto lint + generated-code drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: gateway/go.mod }
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - run: make proto-check BUF=buf

  docs:
    name: generated docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: gateway/go.mod }
      # Regenerate and fail on a difference, the same shape as proto-check.
      # This catches a .proto comment, an FDW option or a column rule changed
      # without the reference page being regenerated. It deliberately does not
      # police the hand-written guides: a rule that every code change must
      # touch docs/ false-positives on refactors and is satisfied by a
      # whitespace edit (docs/PLAN.md Phase 6 Part 2).
      - run: make docs-check
      # Build the site too. Without this, a broken internal link or an invalid
      # mkdocs.yml merges cleanly and is only discovered when the Pages deploy
      # on main fails -- after the fact, and on someone else's push. The
      # version is pinned to the one the pages workflow uses.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install mkdocs-material==9.5.49
      # --strict comes from mkdocs.yml, so a warning is a failure.
      - run: mkdocs build --site-dir /tmp/site

  gateway-unit:
    name: gateway unit tests + lint + vuln scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: gateway/go.mod }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          working-directory: gateway
      - run: make gateway-test
      - run: make gateway-vuln

  extension-unit:
    # One job per supported Postgres major, because the crate has six
    # version-gated branch sets and a single-version build compiles at most one
    # arm of each:
    #   fdw.rs   pg_foreign_server_aclcheck / object_aclcheck   (pg16 split)
    #   fdw.rs   create_foreignscan_path arity                  (pg17 split)
    #   fdw.rs   makeVar varno type                             (pg16 split)
    #   shmem.rs dsa_create / dsa_create_ext                    (pg17 split)
    # The aclcheck pair shipped in #12 with its pg14/pg15 arm never compiled
    # anywhere, which is what prompted this. pg15 is omitted deliberately: it
    # shares every branch arm with pg14 here, so it would add runtime without
    # covering a line pg14 does not already cover. Revisit if a pg15-only
    # branch ever appears.
    name: extension pg${{ matrix.pg }} (unit + pg tests + clippy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["14", "16", "17"]
    env:
      PG_MAJOR: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL ${{ env.PG_MAJOR }} (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-${PG_MAJOR} postgresql-server-dev-${PG_MAJOR} libclang-dev clang
          # cargo pgrx test runs initdb/postgres as the current user; it must own the install dirs.
          sudo chown -R "$USER" /usr/lib/postgresql/${PG_MAJOR} /usr/share/postgresql/${PG_MAJOR}
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        # Keyed per major: the builds differ by feature flag and by the
        # generated pg_sys bindings, so one shared cache would thrash.
        with:
          workspaces: extension
          key: pg${{ matrix.pg }}
      - name: Install cargo tooling
        run: |
          cargo install cargo-pgrx --version "${CARGO_PGRX_VERSION}" --locked
          cargo pgrx init --pg${PG_MAJOR} /usr/lib/postgresql/${PG_MAJOR}/bin/pg_config
      - name: Install audit tooling
        # Only where make ext-audit actually runs; building these three times
        # would cost more than the scan itself.
        if: matrix.pg == '16'
        run: cargo install cargo-audit cargo-deny --locked
      - run: make ext-lint PG=pg${PG_MAJOR}
      - run: make ext-test PG=pg${PG_MAJOR}
      # Advisory and licence scanning reads Cargo.lock, which does not vary by
      # Postgres major, so run it once rather than three times.
      - if: matrix.pg == '16'
        run: make ext-audit

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits to scope the scan
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: "e2e (all phase gates; one build, one kind cluster)"
    runs-on: ubuntu-latest
    needs: [gateway-unit, extension-unit]
    # All gates run in one job, driven by the same script used locally, so CI
    # and a developer's machine exercise one code path.
    #
    # They were previously five chained jobs, which paid for five image builds
    # and five clusters. The build dominated: the Phase 0 gate needs no cluster
    # at all and still took ~11 minutes, almost all of it compiling cargo-pgrx
    # and the extension inside Docker.
    #
    # Gates still run oldest-first and stop at the first failure, so the
    # regression ordering of docs/RULES.md §4 holds: a later gate is only
    # reported green if every earlier one passed. run_all.sh prints a per-gate
    # banner and a timing summary, so a failure still names the gate.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: make e2e
        env:
          E2E_TIMEOUT_SECS: "180"
