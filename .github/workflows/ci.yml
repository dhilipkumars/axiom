name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PG_MAJOR: "16"
  CARGO_PGRX_VERSION: "0.19.2"

jobs:
  proto:
    name: proto lint + generated-code drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: gateway/go.mod }
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - run: make proto-check BUF=buf

  docs:
    name: generated docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: gateway/go.mod }
      # Regenerate and fail on a difference, the same shape as proto-check.
      # This catches a .proto comment, an FDW option or a column rule changed
      # without the reference page being regenerated. It deliberately does not
      # police the hand-written guides: a rule that every code change must
      # touch docs/ false-positives on refactors and is satisfied by a
      # whitespace edit (docs/PLAN.md Phase 6 Part 2).
      - run: make docs-check
      # Build the site too. Without this, a broken internal link or an invalid
      # mkdocs.yml merges cleanly and is only discovered when the Pages deploy
      # on main fails -- after the fact, and on someone else's push. The
      # version is pinned to the one the pages workflow uses.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install mkdocs-material==9.5.49
      # --strict comes from mkdocs.yml, so a warning is a failure.
      - run: mkdocs build --site-dir /tmp/site

  release-plumbing:
    name: changesets + version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Whether a change deserved a changeset is a judgement and stays in
      # review (.changes/README.md says why). Whether an existing changeset is
      # well-formed is mechanically detectable, so it is enforced here: a bad
      # `kind:` would otherwise drop the entry from the changelog silently, and
      # be noticed by its absence after the release.
      #
      # The version check is the same argument. The control file and the
      # gateway must keep deriving the version rather than pinning it, and a
      # pinned copy is only wrong the first time the version changes -- which
      # is the release, the worst moment to find out.
      - run: make release-check

  gateway-unit:
    name: gateway unit tests + lint + vuln scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: gateway/go.mod }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          working-directory: gateway
      # Coverage recorded here is merged with the e2e suite's in that job (#90).
      - run: make gateway-test GATEWAY_COVER_DIR=coverage/unit
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-unit-coverage
          path: coverage/unit
          retention-days: 7
      - run: make gateway-vuln

  extension-unit:
    # One job per supported Postgres major. The window is 16 through the
    # latest (issue #19): 14 reaches end of life in November 2026 and 15 is not
    # where the installed base is, while 16 is supported until November 2028.
    #
    # Three version-gated splits remain, and a single-version build compiles
    # only one arm of each, which is why every major in the window is built:
    #   shmem.rs  dsa_create (16) vs dsa_create_ext (17+)
    #   fdw.rs    create_foreignscan_path, three arities: 16, 17, 18+
    #   fdw.rs    tuple descriptor attrs (16, 17) vs compact_attrs (18+)
    # Two further pairs were deleted along with 14 and 15. The last two were
    # found by adding 18 here: both are real upstream changes that no amount of
    # reading would reliably have caught.
    name: extension pg${{ matrix.pg }} (unit + pg tests + clippy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
    env:
      PG_MAJOR: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL ${{ env.PG_MAJOR }} (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-${PG_MAJOR} postgresql-server-dev-${PG_MAJOR} libclang-dev clang
          # cargo pgrx test runs initdb/postgres as the current user; it must own the install dirs.
          sudo chown -R "$USER" /usr/lib/postgresql/${PG_MAJOR} /usr/share/postgresql/${PG_MAJOR}
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        # Keyed per major: the builds differ by feature flag and by the
        # generated pg_sys bindings, so one shared cache would thrash.
        with:
          workspaces: extension
          key: pg${{ matrix.pg }}
      - name: Install cargo tooling
        run: |
          cargo install cargo-pgrx --version "${CARGO_PGRX_VERSION}" --locked
          cargo pgrx init --pg${PG_MAJOR} /usr/lib/postgresql/${PG_MAJOR}/bin/pg_config
      - name: Install audit tooling
        # Only where make ext-audit actually runs; building these three times
        # would cost more than the scan itself.
        if: matrix.pg == '16'
        run: cargo install cargo-audit cargo-deny --locked
      - run: make ext-lint PG=pg${PG_MAJOR}
      - run: make ext-test PG=pg${PG_MAJOR}
      # Advisory and licence scanning reads Cargo.lock, which does not vary by
      # Postgres major, so run it once rather than three times.
      - if: matrix.pg == '16'
        run: make ext-audit

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits to scope the scan
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: "e2e (all phase gates; one build, one kind cluster)"
    runs-on: ubuntu-latest
    needs: [gateway-unit, extension-unit]
    # All gates run in one job, driven by the same script used locally, so CI
    # and a developer's machine exercise one code path.
    #
    # They were previously five chained jobs, which paid for five image builds
    # and five clusters. The build dominated: the Phase 0 gate needs no cluster
    # at all and still took ~11 minutes, almost all of it compiling cargo-pgrx
    # and the extension inside Docker.
    #
    # Gates still run oldest-first and stop at the first failure, so the
    # regression ordering of docs/RULES.md §4 holds: a later gate is only
    # reported green if every earlier one passed. run_all.sh prints a per-gate
    # banner and a timing summary, so a failure still names the gate.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: helm/kind-action@v1
        with:
          install_only: true
      # Go only for `go tool covdata` in the coverage report below.
      - uses: actions/setup-go@v5
        with: { go-version-file: gateway/go.mod }
      - uses: actions/download-artifact@v4
        with:
          name: gateway-unit-coverage
          path: coverage/unit
      - run: make e2e
        env:
          E2E_TIMEOUT_SECS: "180"
          # The gateway image records coverage, and the suite collects it (#90).
          E2E_COVER_DIR: ${{ github.workspace }}/coverage/e2e
      # Unit, e2e and combined gateway coverage per package, in the job summary.
      # Report-only for now: a baseline comes first, then a ratchet.
      - name: gateway coverage report
        if: always()
        run: scripts/coverage-report coverage/unit coverage/e2e coverage/report >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-coverage
          path: |
            coverage/report/coverage.html
            coverage/report/coverage.txt
          retention-days: 14

  # The downloadable artifact, against a stock Postgres. Separate from the e2e
  # job because it shares nothing with it: no cluster, no gateway, no compose
  # stack -- it builds the tarball and unpacks it into upstream's image.
  tarball:
    name: tarball installs into a stock postgres
    runs-on: ubuntu-latest
    needs: [extension-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: make e2e-tarball

  # The packages, and specifically their metadata. Separate from `tarball`
  # because it asserts the opposite thing: that a package *refuses* to install
  # where the binary would not run. A dependency nobody checks is decoration,
  # and the way you find out is a user reporting that Postgres will not start.
  package:
    name: packages install, and refuse where they should
    runs-on: ubuntu-latest
    needs: [extension-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: make e2e-package
