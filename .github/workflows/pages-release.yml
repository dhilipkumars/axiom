# A docs change on a release branch -- a backport -- republishes the site, and
# so does publishing a release, which can change which branch is the released
# docs.
#
# The site is built and deployed by pages.yml on main, because only main may
# deploy to the github-pages environment. This asks for that run rather than
# deploying itself; the run on main then builds every release's docs from its
# branch, and dev from main (#114).
#
# It lives on main so that every release branch, and every release's tag,
# carries it. A push to main never fires it: main publishes through pages.yml.
name: pages (release branch)

on:
  push:
    branches: ["release-*"]
    paths:
      - docs/**
      - examples/*/README.md
      - docs-overrides/**
      - mkdocs.yml
  # Runs from the release's tag, which cannot deploy either.
  release:
    types: [published]

permissions:
  actions: write

jobs:
  republish:
    # A prerelease never becomes the released docs.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      # A workflow_dispatch from GITHUB_TOKEN is one of the events that does
      # start another workflow.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
