# Overlay for `make local-dev-up`: the base stack, pointed at a real cluster
# through a kubeconfig that scripts/local-dev prepared.
#
#   scripts/local-dev up [context]
#
# The base stack already mints a throwaway CA and server certificate in its
# `certs` init service, and both services wait for it, so there is no openssl
# ceremony here and no plaintext path -- the dev stack speaks the same TLS the
# deployed one does.
services:
  gateway:
    command:
      - -listen
      - :8443
      - -tls-cert
      - /certs/gateway.crt
      - -tls-key
      - /certs/gateway.key
      - -kubeconfig
      - /kube/config
      # No -serve: it narrows nothing by default, so the credentials in the
      # kubeconfig are what bound this. That is the same rule the deployed
      # gateway follows, where RBAC on the ServiceAccount is the only bound.
    volumes:
      - certs:/certs:ro
      - ${AXIOM_KUBECONFIG:-/dev/null}:/kube/config:ro
    # Linux does not resolve host.docker.internal on its own; Docker Desktop
    # does. Declaring it on both is harmless and makes a host-local API server
    # reachable the same way everywhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    # Published so a psql on the host can reach it. Loopback only: this
    # password is a development constant and the port must not be routable.
    ports:
      - "127.0.0.1:${AXIOM_PG_PORT:-55432}:5432"
