# Phase 0 local stack: gateway + Postgres with the axiom extension, TLS between
# them via a throwaway CA generated on every start. No Kubernetes involved yet.
name: axiom

services:
  certs:
    image: alpine/openssl:3.3.3
    entrypoint: ["/bin/sh", "/gen.sh"]
    # The kind node name is part of the certificate's SANs: Postgres reaches an
    # in-cluster gateway through the node's NodePort, so the name it dials must
    # be on the certificate.
    environment:
      E2E_KIND_CLUSTER: ${E2E_KIND_CLUSTER:-axiom-e2e}
    volumes:
      - certs:/certs
      - ./certs/gen.sh:/gen.sh:ro

  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    # Base stack has no cluster (Phase 0 plumbing). The kind overlay
    # (docker-compose.kind.yml) replaces this command with a kubeconfig.
    command: ["-listen", ":8443", "-tls-cert", "/certs/gateway.crt", "-tls-key", "/certs/gateway.key", "-no-cluster"]
    volumes:
      - certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  postgres:
    build:
      context: ../..
      dockerfile: extension/Dockerfile
    environment:
      POSTGRES_USER: axiom
      # Dev-only password for a container that only listens inside the compose
      # network; the E2E script never publishes this port to the host.
      POSTGRES_PASSWORD: axiom-dev
      POSTGRES_DB: axiom
    command:
      - postgres
      - -c
      - shared_preload_libraries=axiom
      - -c
      - axiom.gateway_endpoint=https://gateway:8443
      - -c
      - axiom.gateway_ca_cert=/certs/ca.crt
      - -c
      - axiom.ping_interval_secs=2
      - -c
      - axiom.rpc_timeout_secs=1
      - -c
      - axiom.notify_database=axiom
      - -c
      - axiom.cache_size_mb=64
    volumes:
      - certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    healthcheck:
      # -h 127.0.0.1 is load-bearing. The official entrypoint runs init scripts
      # against a *temporary* server started with listen_addresses='', then
      # shuts it down and starts the real one. A socket-based pg_isready (the
      # default with no -h) succeeds against that temporary server, so compose
      # reports the container healthy and the next command hits "the database
      # system is shutting down". Only the real server accepts TCP.
      test: ["CMD-SHELL", "pg_isready -U axiom -d axiom -h 127.0.0.1"]
      interval: 2s
      timeout: 2s
      retries: 30
      # Failures during initdb are expected and must not burn the retry budget.
      start_period: 30s

volumes:
  certs:
