# Identity for the Axiom gateway.
#
# **Reads are cluster-wide by default; writes are not.**
#
# The read rule is a wildcard because discovery is the product: Axiom offers
# exactly what this identity may list, so a curated read list means a curated
# set of tables, and every kind a user has not thought to add in advance is
# missing at the moment they think to ask about it. That includes API groups
# installed later by someone else -- `metrics.k8s.io` from metrics-server,
# an operator's CRDs -- which a wildcard picks up without anyone editing this
# file. Read-only is also the verb set where a wildcard is defensible: it
# cannot change cluster state, and the API server still enforces it.
#
# ## What a wildcard read includes, and what to do about it
#
# **Secrets.** `resources: ["*"]` covers Secrets, cluster-wide. Until per-caller
# identity lands (#71), every Postgres role that can query a foreign table
# reaches Kubernetes as *this* identity -- so with this default, anyone who can
# `SELECT` can read every Secret in the cluster. That is a deliberate default
# for a read-oriented tool, not an oversight, but it is the wrong default for a
# shared or multi-tenant database.
#
# To restrict it, replace the wildcard read rule with an enumerated list of the
# groups and resources you want visible. Axiom degrades correctly: discovery
# offers only what this permits, so narrowing the role narrows the tables
# rather than breaking anything.
#
# ## Writes stay enumerated
#
# INSERT, UPDATE and DELETE on a foreign table are real Kubernetes writes, so
# the mutating verbs are granted per resource, deliberately. Add a resource
# here only when you intend SQL to be able to change it. This is where blast
# radius actually lives, and it is why the wildcard above is read-only.
#
# Changing this file requires a gateway restart -- it caches what it may access
# -- and then a re-import, since foreign tables are catalog objects and do not
# follow the change themselves.
apiVersion: v1
kind: Namespace
metadata:
  name: axiom-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axiom-gateway
  namespace: axiom-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: axiom-gateway
rules:
  # Read everything the cluster has, including API groups added after this is
  # applied. See the header for what this includes and how to narrow it.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Writes, enumerated. Nothing is mutable through SQL unless it is named here.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "update", "delete"]
  # The test CRD the e2e gate exercises. A real deployment lists its own here.
  - apiGroups: ["example.com"]
    resources: ["widgets"]
    verbs: ["create", "update", "delete"]

  # Schema discovery reads the aggregated discovery and OpenAPI documents.
  # These are non-resource URLs and grant no access to any object. Kubernetes
  # binds system:discovery to system:authenticated by default, so this is
  # usually redundant; it is spelled out so the dependency is visible rather
  # than inherited by accident.
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*", "/openapi", "/openapi/*", "/version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axiom-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: axiom-gateway
subjects:
  - kind: ServiceAccount
    name: axiom-gateway
    namespace: axiom-system
