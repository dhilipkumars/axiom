# Least-privilege identity for the Axiom gateway (docs/RULES.md §3).
# Phase 1: read-only Pods (`get`, `list`). Phase 2: read-write ConfigMaps
# (`get`, `list`, `create`, `update`, `delete`). Later phases append verbs/
# resources as they land (watch in Phase 3); nothing is granted ahead of need.
apiVersion: v1
kind: Namespace
metadata:
  name: axiom-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axiom-gateway
  namespace: axiom-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: axiom-gateway-read
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axiom-gateway-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: axiom-gateway-read
subjects:
  - kind: ServiceAccount
    name: axiom-gateway
    namespace: axiom-system
