# Least-privilege identity for the Axiom gateway (docs/RULES.md §3).
# Phase 1: read-only Pods (`get`, `list`). Phase 2: read-write ConfigMaps
# (`get`, `list`, `create`, `update`, `delete`). Phase 3: `watch` on both, for
# the Subscribe stream. Phase 4: the example.com test CRD, plus the discovery
# and OpenAPI endpoints that schema discovery reads. Nothing is granted ahead
# of need.
#
# This is what bounds Axiom: the gateway offers what this permits, and the API
# server enforces it. To change what appears in SQL, change this file and
# restart the gateway -- it caches what it may access -- then re-import, since
# foreign tables are catalog objects and do not follow the change themselves.
#
# The role is named for the identity it belongs to, not for what it grants. It
# is not read-only: ConfigMaps and the example CRD are writable, because
# INSERT, UPDATE and DELETE on a foreign table are real Kubernetes writes.
apiVersion: v1
kind: Namespace
metadata:
  name: axiom-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axiom-gateway
  namespace: axiom-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: axiom-gateway
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Phase 4: the test CRD the e2e gate exercises. A real deployment lists its
  # own CRDs here; there is deliberately no wildcard.
  - apiGroups: ["example.com"]
    resources: ["widgets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Schema discovery reads the aggregated discovery and OpenAPI documents.
  # These are non-resource URLs and grant no access to any object; the
  # resource rules above remain the only way the gateway reaches data.
  # Kubernetes binds system:discovery to system:authenticated by default, so
  # this is usually redundant; it is spelled out so the dependency is visible
  # rather than inherited by accident.
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*", "/openapi", "/openapi/*", "/version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axiom-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: axiom-gateway
subjects:
  - kind: ServiceAccount
    name: axiom-gateway
    namespace: axiom-system
