[graph]
all-features = false
no-default-features = true
features = ["pg16"]

[advisories]
version = 2
yanked = "deny"
# Triaged/accepted advisories go here with a justification comment (docs/RULES.md §3).
ignore = [
    # Unmaintained-crate notices, not vulnerabilities. All are transitive with
    # no upstream upgrade available; revisit when pgrx/tonic bump them.
    { id = "RUSTSEC-2021-0127", reason = "serde_cbor via pgrx 0.12.9 (schema generation only, never sees gateway input)" },
    { id = "RUSTSEC-2024-0436", reason = "paste via pgrx-tests 0.12.9 (dev/test dependency, proc-macro only)" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile via tonic 0.12 TLS config; PEM parsing of operator-provided CA only" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "PostgreSQL",
    "Unlicense",
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
