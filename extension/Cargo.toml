[package]
name = "axiom"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Axiom: a Postgres foreign data wrapper for Kubernetes (Phase 0 plumbing)"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Supported window: 16 through the latest major (docs/PLAN.md, issue #19).
# 14 and 15 were dropped here; 14 reaches end of life in November 2026 and
# neither is where the installed base is. 19 is added when it leaves beta.
default = ["pg16"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.19.2"
tokio = { version = "1", features = ["rt", "time", "net"] }
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport", "tls", "tls-webpki-roots", "channel"] }
prost = "0.13"
prost-types = "0.13"
url = "2"
serde_json = "1"

[build-dependencies]
tonic-build = { version = "0.12", default-features = false, features = ["prost", "transport"] }
protoc-bin-vendored = "3"

[dev-dependencies]
pgrx-tests = "=0.19.2"
# In-process stub gateway for integration tests (extension + real Postgres, no cluster).
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
postgres = "0.19"
eyre = "0.6"
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
# The `postgres` notification iterators are FallibleIterator, and the trait has
# to be in scope to call them. Already in the lock file as a dependency of
# `postgres` itself; this only makes it nameable from the tests.
fallible-iterator = "0.2"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
# pgrx's pg_module_magic! probes every pg version feature it knows about.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("pg13", "pg14", "pg15", "pg19"))'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Reviewed allow-list (docs/RULES.md §1): each entry has a reason.
# pgrx-generated glue (pg_module_magic!, #[pg_extern]) trips these; not actionable in our code.
missing_errors_doc = "allow"   # error contracts are documented in the item doc comment prose instead
module_name_repetitions = "allow"  # `config::ConfigError` style naming is intentional
must_use_candidate = "allow"   # noisy on small pure helpers
