version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - unused
    - ineffassign
    - misspell
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    paths:
      - gen/
formatters:
  enable:
    - gofmt
    - goimports
