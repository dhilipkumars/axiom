version: v2
# Generators are run through `go tool` so the exact plugin versions are pinned
# by gateway/go.mod rather than by whatever happens to be on PATH.
plugins:
  - local: ["go", "tool", "-C", "../gateway", "google.golang.org/protobuf/cmd/protoc-gen-go"]
    out: ../gateway/gen
    opt: paths=source_relative
  - local: ["go", "tool", "-C", "../gateway", "google.golang.org/grpc/cmd/protoc-gen-go-grpc"]
    out: ../gateway/gen
    opt: paths=source_relative
