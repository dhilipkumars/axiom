// Axiom gateway API, v1.
//
// Phase 0 defined the liveness surface (Ping). Phase 1 added read-only, on-demand
// access (Get/List). Phase 2 added the write path (Create/Update/Delete). Phase 3
// adds the watch stream (Subscribe). Phase 4 adds DiscoverSchema per
// docs/DESIGN.md §5.1. Credentials never appear as fields in
// any message here: each side holds its own credentials locally (docs/RULES.md §3).
syntax = "proto3";

package axiom.v1;

option go_package = "github.com/dhilipkumars/axiom/gateway/gen/axiom/v1;axiomv1";

import "google/protobuf/timestamp.proto";

// GatewayService is the cluster-side service the Postgres extension talks to.
service GatewayService {
  // Ping is a liveness round-trip used by the extension's background worker to
  // verify connectivity and TLS setup. The gateway echoes the caller's nonce so
  // the caller can detect a mismatched/out-of-order reply, and reports its own
  // version and clock for diagnostics.
  //
  // Errors: INVALID_ARGUMENT if the request nonce is zero (zero is reserved as
  // "unset" so accidental default-constructed requests are rejected loudly).
  rpc Ping(PingRequest) returns (PingResponse);

  // Get fetches a single object by kind, namespace and name, straight from the
  // API server (never from a cache).
  //
  // Errors: INVALID_ARGUMENT for an unsupported/malformed gvk or an invalid
  // namespace/name; NOT_FOUND if the object does not exist; PERMISSION_DENIED
  // if the gateway's own RBAC identity may not read it; FAILED_PRECONDITION if
  // the gateway has no cluster configured; UNAVAILABLE if the API server cannot
  // be reached.
  rpc Get(GetRequest) returns (GetResponse);

  // List fetches objects of one kind, optionally narrowed to a namespace and/or
  // a single name. Filters are applied server-side (namespace scoping and a
  // metadata.name field selector), never by fetching everything and filtering
  // in the gateway.
  //
  // Errors: as for Get, except that a filter matching nothing is an empty
  // response, not NOT_FOUND.
  rpc List(ListRequest) returns (ListResponse);

  // Create creates one object from its JSON body. The gateway forces
  // apiVersion/kind from gvk and requires body metadata.name/namespace (if
  // present) to equal the request fields.
  //
  // Errors: INVALID_ARGUMENT for an unsupported gvk, invalid names, a body
  // that is not a JSON object or whose identity disagrees with the request,
  // or a body the API server rejects as invalid; ALREADY_EXISTS if an object
  // with that name exists; PERMISSION_DENIED / FAILED_PRECONDITION /
  // UNAVAILABLE as for Get.
  rpc Create(CreateRequest) returns (CreateResponse);

  // Update replaces one object (HTTP PUT) with optimistic concurrency: the
  // request must carry the resource_version the caller last read, and the
  // API server rejects the write if the object has changed since.
  //
  // Errors: INVALID_ARGUMENT if resource_version is empty or the body/identity
  // is invalid (as for Create); ABORTED if the resource_version is stale
  // (HTTP 409 Conflict) so callers can distinguish "retry after re-read" from
  // every other failure; NOT_FOUND if the object no longer exists;
  // PERMISSION_DENIED / FAILED_PRECONDITION / UNAVAILABLE as for Get.
  rpc Update(UpdateRequest) returns (UpdateResponse);

  // Delete deletes one object by name.
  //
  // Errors: INVALID_ARGUMENT for unsupported gvk / invalid names; NOT_FOUND
  // if it does not exist; PERMISSION_DENIED / FAILED_PRECONDITION /
  // UNAVAILABLE as for Get.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Subscribe streams the current state and then live changes of one kind,
  // optionally narrowed to a namespace. This is the feed behind the
  // extension's shared-memory cache; one stream per (cluster, kind, namespace)
  // is held open by the extension's background worker.
  //
  // Without resource_version the gateway performs a full LIST and emits every
  // object as ADDED with an EMPTY resource_version (a partial listing is not a
  // valid resume point), then a SYNCED event carrying the list's
  // resourceVersion, then live ADDED/MODIFIED/DELETED events and BOOKMARK
  // events. With a resource_version the gateway resumes the watch from that
  // point and sends no initial listing and no SYNCED: the backlog since the
  // bookmark is delivered as ordinary events, and the API server's first
  // BOOKMARK (which it only sends once the watcher is caught up) is the
  // caller's signal that the cache is current again. If the API server no
  // longer has that history (HTTP 410 Gone) the gateway emits RESYNC_REQUIRED
  // and ends the stream, and the caller must resubscribe without a
  // resource_version and rebuild its cache.
  //
  // Errors: INVALID_ARGUMENT for unsupported gvk / invalid namespace;
  // PERMISSION_DENIED / FAILED_PRECONDITION / UNAVAILABLE as for Get. Once
  // streaming, transient watch drops are handled inside the gateway by
  // re-watching from the last seen resourceVersion; the stream only ends on
  // RESYNC_REQUIRED, a non-retryable error, or client cancellation.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

message PingRequest {
  // Caller-chosen, non-zero. Echoed back verbatim in PingResponse.nonce.
  uint64 nonce = 1;
}

message PingResponse {
  // Echo of PingRequest.nonce.
  uint64 nonce = 1;
  // Gateway build version string (e.g. "0.1.0" or a git describe).
  string gateway_version = 2;
  // Gateway wall-clock time at the moment the reply was built.
  google.protobuf.Timestamp server_time = 3;
}

// GroupVersionKind identifies a Kubernetes resource kind. Group is empty for
// the core API group.
message GroupVersionKind {
  string group = 1;
  string version = 2;
  string kind = 3;
}

// Object is one Kubernetes object as returned by the API server.
message Object {
  // metadata.namespace; empty for cluster-scoped kinds.
  string namespace = 1;
  // metadata.name.
  string name = 2;
  // metadata.resourceVersion, opaque; carried for Phase 2 optimistic
  // concurrency and Phase 3 watch bookmarks.
  string resource_version = 3;
  // The full object as JSON, exactly as serialised by the API server. The
  // receiver must treat this as untrusted input and bounds-check it.
  bytes json = 4;
}

message GetRequest {
  GroupVersionKind gvk = 1;
  // Required for namespaced kinds, must be empty for cluster-scoped kinds.
  string namespace = 2;
  string name = 3;
}

message GetResponse {
  Object object = 1;
}

message ListRequest {
  GroupVersionKind gvk = 1;
  // Empty means all namespaces.
  string namespace = 2;
  // If non-empty, only the object with exactly this name is returned
  // (server-side metadata.name field selector).
  string name = 3;
}

message ListResponse {
  repeated Object objects = 1;
  // resourceVersion of the list itself, usable as a watch start point.
  string resource_version = 2;
}

message CreateRequest {
  GroupVersionKind gvk = 1;
  string namespace = 2;
  string name = 3;
  // Full object as JSON. apiVersion/kind are overwritten from gvk.
  bytes json = 4;
}

message CreateResponse {
  // The object as stored by the API server (with uid, resourceVersion, defaults).
  Object object = 1;
}

message UpdateRequest {
  GroupVersionKind gvk = 1;
  string namespace = 2;
  string name = 3;
  // Required. The metadata.resourceVersion the caller last read.
  string resource_version = 4;
  // Full replacement object as JSON. metadata.resourceVersion inside the
  // body, if present, must equal resource_version.
  bytes json = 5;
}

message UpdateResponse {
  Object object = 1;
}

message DeleteRequest {
  GroupVersionKind gvk = 1;
  string namespace = 2;
  string name = 3;
}

message DeleteResponse {}

message SubscribeRequest {
  GroupVersionKind gvk = 1;
  // Empty means all namespaces.
  string namespace = 2;
  // Empty means "list everything first"; otherwise resume the watch from here.
  string resource_version = 3;
}

// SubscribeResponse is one watch event.
message SubscribeResponse {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    // Object exists (initial listing) or was created.
    TYPE_ADDED = 1;
    // Object changed.
    TYPE_MODIFIED = 2;
    // Object was deleted; `object` carries its last known state.
    TYPE_DELETED = 3;
    // The initial listing is complete and the cache is current;
    // `resource_version` is the list's.
    TYPE_SYNCED = 4;
    // No change; `resource_version` advances the resume point. The API server
    // emits bookmarks only for a caught-up watcher, so on a resumed stream the
    // first BOOKMARK also means "current again".
    TYPE_BOOKMARK = 5;
    // The requested resource_version is too old (410 Gone). The stream ends
    // after this event; resubscribe without a resource_version.
    TYPE_RESYNC_REQUIRED = 6;
  }
  Type type = 1;
  // Present for TYPE_ADDED/TYPE_MODIFIED/TYPE_DELETED.
  Object object = 2;
  // Present for TYPE_SYNCED/TYPE_BOOKMARK and, when known, for
  // TYPE_RESYNC_REQUIRED, and for live TYPE_ADDED/MODIFIED/DELETED events.
  // Empty on initial-listing TYPE_ADDED events: never resume from those.
  string resource_version = 3;
}
